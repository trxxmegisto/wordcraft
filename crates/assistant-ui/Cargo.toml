[package]
name = "wordcraft-assistant-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft writing assistant's task pane (KWordCraft fork), plugged into wordcraft-ui-egui's pane extension point"

[lints]
workspace = true

[dependencies]
wordcraft-assistant = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
# The combo box the app uses (egui's can't grow back while open); same rev as ui-egui's.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
serde_json = { workspace = true }
# Where WordCraft keeps its settings (the assistant's connection settings go next to them).
wordcraft-control-key = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = "3"
